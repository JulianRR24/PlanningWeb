<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PlanningHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="./assets/icons/icon-192.png" />
    <link href="./dist/output.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css" />
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "2d86bc3b-c723-4b2a-a414-7724e0018c27",
          safari_web_id: "web.onesignal.auto.147da6f8-95e8-4f3e-9e77-8dc52e1c58f0",
          notifyButton: {
            enable: true,
          },
        });
      });
    </script>
  </head>

  <body
    class="min-h-screen bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100"
  >
    <header></header>

    <main class="max-w-5xl mx-auto px-4 py-6 space-y-8">
      <section class="space-y-4" data-aos="fade-up">
        <div class="flex items-center justify-between">
          <h2 class="text-lg font-semibold">Widgets</h2>
          <button
            type="button"
            id="manageWidgets"
            class="px-3 py-2 rounded-md bg-slate-900 text-white dark:bg-white dark:text-slate-900"
          >
            Gestionar
          </button>
        </div>
        <div
          id="widgetsGrid"
          class="grid grid-cols-1 sm:grid-cols-2 gap-4"
        ></div>
      </section>

      <section class="space-y-4" data-aos="fade-up" data-aos-delay="50">
        <div class="flex items-center justify-between">
          <h2 class="text-lg font-semibold">Planning de Hoy</h2>
          <div class="flex items-center gap-2">
            <select
              id="activeRoutineSelector"
              class="px-3 py-2 bg-white dark:bg-slate-800 rounded-md border border-slate-200 dark:border-slate-700"
            ></select>
            <span id="currentDate" class="text-sm opacity-70"></span>
          </div>
        </div>
        <div
          class="relative overflow-hidden rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-800"
        >
          <div class="grid grid-cols-[64px_1fr]">
            <div
              id="hoursColumn"
              class="border-r border-slate-200 dark:border-slate-700"
            ></div>
            <div class="relative">
              <div id="dayGrid" class="relative"></div>
              <div
                id="timeNeedle"
                class="absolute left-0 right-0 h-[2px] bg-rose-500"
              ></div>
              <div
                id="timeTag"
                class="absolute -translate-y-1/2 px-2 py-1 bg-rose-500 text-white text-xs rounded-md"
              ></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div
      id="settingsModal"
      class="fixed inset-0 hidden items-center justify-center bg-black/40 p-4"
    >
      <div
        class="w-full max-w-lg rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-800 p-4 space-y-4"
      >
        <div class="flex items-center justify-between">
          <div class="font-semibold">Configuración</div>
          <button
            type="button"
            id="settingsClose"
            class="p-2 rounded-md hover:bg-slate-100 dark:hover:bg-slate-700"
            aria-label="Cerrar"
          >
            ✕
          </button>
        </div>
        <div class="space-y-4">
          <div class="space-y-2">
            <div class="font-medium">Notificaciones</div>
            <div class="grid grid-cols-2 gap-4">
              <label class="text-sm space-y-1">
                <span class="block opacity-70 min-h-[2.5rem] flex items-end pb-1">Minutos antes de iniciar</span>
                <input
                  id="notifyBeforeStart"
                  type="number"
                  min="0"
                  class="w-full px-3 py-2 rounded-md bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700"
                />
              </label>
              <label class="text-sm space-y-1">
                <span class="block opacity-70 min-h-[2.5rem] flex items-end pb-1">Minutos antes de finalizar</span>
                <input
                  id="notifyBeforeEnd"
                  type="number"
                  min="0"
                  class="w-full px-3 py-2 rounded-md bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700"
                />
              </label>
            </div>
            <!-- Botón de guardar movido al final -->
          </div>
          <div class="space-y-2">
            <div class="font-medium">Apariencia</div>
            <div class="flex items-center justify-between">
              <span class="text-sm opacity-70">Modo Oscuro</span>
              <button
                type="button"
                id="themeToggle"
                class="px-3 py-2 rounded-md border border-slate-200 dark:border-slate-700 text-sm hover:bg-slate-100 dark:hover:bg-slate-700"
              >
                Alternar Tema
              </button>
            </div>
          </div>
          <div class="space-y-2">
            <div class="font-medium">Permisos</div>
            <div class="grid grid-cols-2 gap-2">
              <button
                type="button"
                id="askNotifyPerm"
                class="px-3 py-2 rounded-md border border-slate-200 dark:border-slate-700"
              >
                Permiso de notificaciones
              </button>
              <button
                type="button"
                id="askGeoPerm"
                class="px-3 py-2 rounded-md border border-slate-200 dark:border-slate-700"
              >
                Permiso de ubicación
              </button>
            </div>
            <div class="text-xs opacity-70">
              Los permisos requieren HTTPS o localhost.
            </div>
          </div>
        </div>
        <button
          type="button"
          id="saveSettings"
          class="w-full mt-4 px-3 py-2 rounded-md bg-slate-900 text-white dark:bg-white dark:text-slate-900 font-medium"
        >
          Guardar cambios
        </button>
      </div>
    </div>

    <!-- Auth Modal -->
    <div
      id="authModal"
      class="fixed inset-0 hidden z-50 overflow-y-auto bg-black/40 backdrop-blur-sm"
    >
      <div class="flex min-h-full items-center justify-center p-4">
        <div
            class="w-full max-w-sm rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-800 p-6 space-y-6 shadow-xl relative"
        >
            <div class="flex items-center justify-between">
                <h3 class="text-lg font-bold" id="authTitle">Iniciar Sesión</h3>
                <button type="button" id="authClose" class="p-2 -mr-2 opacity-60 hover:opacity-100">✕</button>
            </div>
            
            <form id="authForm" class="space-y-4">
                <div class="space-y-1">
                    <label class="text-sm font-medium opacity-80">Correo electrónico</label>
                    <input type="email" id="authEmail" required class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-400">
                </div>
                <div class="space-y-1">
                    <label class="text-sm font-medium opacity-80">Contraseña</label>
                    <input type="password" id="authPassword" required minlength="6" class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-400">
                </div>
                <div id="authError" class="text-xs text-rose-500 hidden"></div>
                
                <button type="submit" class="w-full py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-medium transition-colors shadow-lg shadow-indigo-500/20">
                    <span id="authSubmitText">Entrar</span>
                </button>
            </form>
            
            <div class="text-center text-sm opacity-80">
                <span id="authSwitchText">¿No tienes cuenta?</span>
                <button type="button" id="authSwitchBtn" class="font-medium text-indigo-500 hover:underline">Regístrate</button>
            </div>
        </div>
      </div>
    </div>

    <!-- Account Modal -->
    <div
      id="accountModal"
      class="fixed inset-0 hidden z-50 overflow-y-auto bg-black/40 backdrop-blur-sm"
    >
      <div class="flex min-h-full items-center justify-center p-4">
        <div
            class="w-full max-w-sm rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-800 p-6 space-y-6 shadow-xl relative"
        >
        <div class="flex items-center justify-between">
            <h3 class="text-lg font-bold">Mi Cuenta</h3>
            <button type="button" id="accountClose" class="p-2 -mr-2 opacity-60 hover:opacity-100">✕</button>
        </div>
        
        <div class="space-y-4">
            <div class="p-3 rounded-lg bg-slate-100 dark:bg-slate-900/50 flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-indigo-100 dark:bg-indigo-900/30 flex items-center justify-center text-indigo-600 dark:text-indigo-400">
                    <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                </div>
                <div class="overflow-hidden">
                    <div class="text-xs opacity-60 uppercase tracking-wider font-semibold">Usuario</div>
                    <div id="accountEmail" class="font-medium truncate">...</div>
                </div>
            </div>
            
            <div class="pt-4 border-t border-slate-200 dark:border-slate-800 space-y-3">
                <!-- Change Password Section -->
                <button type="button" id="btnShowChangePass" class="w-full py-2 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors text-sm font-medium">
                    Cambiar Contraseña
                </button>
                
                <div id="changePassContainer" class="hidden space-y-3 p-3 bg-slate-50 dark:bg-slate-900/50 rounded-lg border border-slate-200 dark:border-slate-700">
                    <div class="space-y-1">
                        <label class="text-xs font-medium opacity-70">Nueva Contraseña</label>
                        <input type="password" id="newPassword" placeholder="Mínimo 6 caracteres" class="w-full px-3 py-2 rounded-md border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div class="flex gap-2">
                        <button type="button" id="btnSavePass" class="flex-1 py-1.5 rounded-md bg-indigo-600 text-white text-xs font-medium hover:bg-indigo-700 transition-colors">
                            Guardar
                        </button>
                        <button type="button" id="btnCancelPass" class="py-1.5 px-3 rounded-md bg-slate-200 dark:bg-slate-700 text-xs font-medium hover:opacity-80 transition-opacity">
                            Cancelar
                        </button>
                    </div>
                </div>

                <button type="button" id="btnLogout" class="w-full py-2 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors text-sm font-medium">
                    Cerrar Sesión
                </button>
                <button type="button" id="btnDeleteAccount" class="w-full py-2 rounded-lg border border-rose-200 dark:border-rose-900/30 text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-900/10 transition-colors text-sm font-medium">
                    Eliminar Cuenta
                </button>
            </div>
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script>
      AOS.init({ once: true });
    </script>
    
    <script type="module" src="./js/push.js"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
