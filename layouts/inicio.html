
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PlanningHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="../manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="../assets/icons/icon-192.png" />
    <link href="../dist/output.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css" />
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function (OneSignal) {
        await OneSignal.init({
          appId: "2d86bc3b-c723-4b2a-a414-7724e0018c27",
          safari_web_id: "web.onesignal.auto.147da6f8-95e8-4f3e-9e77-8dc52e1c58f0",
          notifyButton: {
            enable: true,
          },
        });
      });
    </script>
  </head>

  <body class="min-h-screen bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100">
    <header></header>

    <main class="max-w-5xl mx-auto px-4 py-6 space-y-8">
      <section class="space-y-4" data-aos="fade-up">
        <div class="flex items-center justify-between">
          <h2 class="text-lg font-semibold">Widgets</h2>
          <button
            type="button"
            id="manageWidgets"
            class="px-3 py-2 rounded-md bg-slate-900 text-white dark:bg-white dark:text-slate-900"
          >
            Gestionar
          </button>
        </div>
        <div id="widgetsGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
      </section>

      <section class="space-y-4" data-aos="fade-up" data-aos-delay="50">
        <div class="flex items-center justify-between">
          <h2 class="text-lg font-semibold">Planning de Hoy</h2>
          <div class="flex items-center gap-2">
            <select
              id="activeRoutineSelector"
              class="px-3 py-2 bg-white dark:bg-slate-800 rounded-md border border-slate-200 dark:border-slate-700"
            ></select>
            <span id="currentDate" class="text-sm opacity-70"></span>
          </div>
        </div>
        <div class="relative overflow-hidden rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-800">
          <div class="grid grid-cols-[64px_1fr]">
            <div id="hoursColumn" class="border-r border-slate-200 dark:border-slate-700"></div>
            <div class="relative">
              <div id="dayGrid" class="relative"></div>
              <div id="timeNeedle" class="absolute left-0 right-0 h-[2px] bg-rose-500"></div>
              <div
                id="timeTag"
                class="absolute -translate-y-1/2 px-2 py-1 bg-rose-500 text-white text-xs rounded-md"
              ></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script>
      AOS.init({ once: true });
    </script>

    <script type="module" src="../js/push.js"></script>
    <script type="module" src="../js/app.js"></script>
  </body>
</html>
