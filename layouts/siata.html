<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PlanningHub · SIATA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="../assets/icons/icon-192.png">

    <link href="../dist/output.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100">
    <header></header>

    <main class="max-w-5xl mx-auto px-4 py-6">
      <section class="space-y-3">
        <div
          class="relative w-full h-[75vh] overflow-hidden rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-800"
        >
          <iframe
            src="https://geoportal.siata.gov.co/"
            class="absolute inset-0 w-full h-full border-0"
            loading="lazy"
            referrerpolicy="no-referrer"
          ></iframe>
        </div>
        <p class="text-xs opacity-60">
          Vista embebida del geoportal de SIATA. Si el visor deja de cargar,
          usa el botón “Abrir en pestaña”.
        </p>

        <div class="flex items-center justify-between">
          <h2 class="text-lg font-semibold">
            Condiciones ambientales (SIATA)
          </h2>

          <a
            href="https://geoportal.siata.gov.co/"
            target="_blank"
            class="text-sm px-3 py-2 rounded-md border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800"
          >
            Abrir en pestaña
          </a>
        </div>
      </section>
    </main>

    <script type="module" src="../js/siata.js"></script>
  </body>
</html>
