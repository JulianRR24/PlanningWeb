<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PlanningHub • Widgets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="../assets/icons/icon-192.png">
    <link href="../dist/output.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">

    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
        appId: "2d86bc3b-c723-4b2a-a414-7724e0018c27",
        safari_web_id: "web.onesignal.auto.147da6f8-95e8-4f3e-9e77-8dc52e1c58f0",
        notifyButton: {
            enable: true,
        },
        });
    });
    </script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100">
    <header></header>

    <main class="max-w-5xl mx-auto px-4 py-6 space-y-8">
        <section class="space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-lg font-semibold">Gestionar Widgets</h2>
                <div class="text-sm opacity-70">Máximo 4 visibles</div>
            </div>
            <div class="grid md:grid-cols-2 gap-4">
                <form id="widgetForm"
                    class="space-y-3 p-4 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-800">
                    <select id="widgetType"
                        class="w-full px-3 py-2 rounded-md bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
                        <option value="market">Lista de mercado</option>
                        <option value="notes">Tareas rápidas</option>
                        <option value="quotes">Frases</option>
                        <option value="weather">Clima</option>
                        <option value="pico_placa">Pico y placa Medellín</option>
                        <option value="siata">SIATA Radar</option>
                    </select>
                    <div class="grid grid-cols-2 gap-2">
                        <input id="widget-name" type="text"
                            class="w-full px-3 py-2 rounded-md bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                            placeholder="Nombre del widget">
                        <input id="widget-order" type="number" min="1" max="4"
                            class="px-3 py-2 rounded-md bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                            placeholder="Orden">
                    </div>
                    <div class="flex items-center gap-2">
                        <label class="flex items-center gap-2 text-sm"><input id="widgetEnabled" type="checkbox"
                                class="scale-110"> Visible</label>
                        <button type="button" id="saveWidget"
                            class="ml-auto px-3 py-2 rounded-md bg-slate-900 text-white dark:bg-white dark:text-slate-900">Guardar</button>
                    </div>
                </form>
                <div class="space-y-3">
                    <div class="flex items-center justify-between">
                        <h3 class="font-medium">Listado</h3>
                        <button type="button" id="deleteWidgetBtn"
                            class="px-3 py-2 rounded-md border border-slate-200 dark:border-slate-700">Limpiar</button>
                    </div>
                    <div id="widgetsList" class="grid gap-2"></div>
                </div>
            </div>
        </section>
    </main>

    <script type="module" src="../js/widgets.js"></script>
</body>

</html>
