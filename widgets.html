<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PlanningHub • Widgets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
        appId: "2d86bc3b-c723-4b2a-a414-7724e0018c27",
        safari_web_id: "web.onesignal.auto.147da6f8-95e8-4f3e-9e77-8dc52e1c58f0",
        notifyButton: {
            enable: true,
        },
        });
    });
    </script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100">
    <header
        class="sticky top-0 z-20 bg-white/80 backdrop-blur-md border-b border-slate-200 dark:bg-slate-900/70 dark:border-slate-800">
        <div class="max-w-5xl mx-auto px-4 py-3 flex flex-col sm:flex-row items-center justify-between gap-4 sm:gap-0">
            <h1 class="text-xl font-semibold">Widgets</h1>
            <nav class="flex flex-wrap justify-center items-center gap-3 text-sm">
                <a class="px-3 py-1.5 rounded-md hover:bg-slate-100 dark:hover:bg-slate-800"
                href="./index.html">Inicio</a>
                <a class="px-3 py-1.5 rounded-md hover:bg-slate-100 dark:hover:bg-slate-800"
                    href="./siata.html">SIATA</a>
                <a class="px-3 py-1.5 rounded-md hover:bg-slate-100 dark:hover:bg-slate-800"
                    href="./rutinas.html">Rutinas</a>
                <a class="px-3 py-1.5 rounded-md hover:bg-slate-100 dark:hover:bg-slate-800"
                    href="./widgets.html">Widgets</a>
                <button type="button" id="settingsBtn" class="p-2 rounded-md hover:bg-slate-100 dark:hover:bg-slate-800"
                    aria-label="Configuración">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" />
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c0 .66.39 1.26 1 1.51H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" />
                    </svg>
                </button>
            </nav>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-6 space-y-8">
        <section class="space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-lg font-semibold">Gestionar Widgets</h2>
                <div class="text-sm opacity-70">Máximo 4 visibles</div>
            </div>
            <div class="grid md:grid-cols-2 gap-4">
                <form id="widgetForm"
                    class="space-y-3 p-4 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-800">
                    <select id="widgetType"
                        class="w-full px-3 py-2 rounded-md bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
                        <option value="market">Lista de mercado</option>
                        <option value="notes">Tareas rápidas</option>
                        <option value="quotes">Frases</option>
                        <option value="weather">Clima</option>
                        <option value="pico_placa">Pico y placa Medellín</option>
                        <option value="siata">SIATA Radar</option>
                    </select>
                    <div class="grid grid-cols-2 gap-2">
                        <input id="widget-name" type="text"
                            class="w-full px-3 py-2 rounded-md bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                            placeholder="Nombre del widget">
                        <input id="widget-order" type="number" min="1" max="4"
                            class="px-3 py-2 rounded-md bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                            placeholder="Orden">
                    </div>
                    <div class="flex items-center gap-2">
                        <label class="flex items-center gap-2 text-sm"><input id="widgetEnabled" type="checkbox"
                                class="scale-110"> Visible</label>
                        <button type="button" id="saveWidget"
                            class="ml-auto px-3 py-2 rounded-md bg-slate-900 text-white dark:bg-white dark:text-slate-900">Guardar</button>
                    </div>
                </form>
                <div class="space-y-3">
                    <div class="flex items-center justify-between">
                        <h3 class="font-medium">Listado</h3>
                        <button type="button" id="deleteWidgetBtn"
                            class="px-3 py-2 rounded-md border border-slate-200 dark:border-slate-700">Limpiar</button>
                    </div>
                    <div id="widgetsList" class="grid gap-2"></div>
                </div>
            </div>
        </section>
    </main>

    <div
      id="settingsModal"
      class="fixed inset-0 hidden items-center justify-center bg-black/40 p-4"
    >
      <div
        class="w-full max-w-lg rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-800 p-4 space-y-4"
      >
        <div class="flex items-center justify-between">
          <div class="font-semibold">Configuración</div>
          <button
            type="button"
            id="settingsClose"
            class="p-2 rounded-md hover:bg-slate-100 dark:hover:bg-slate-700"
            aria-label="Cerrar"
          >
            ✕
          </button>
        </div>
        <div class="space-y-4">
          <div class="space-y-2">
            <div class="font-medium">Notificaciones</div>
            <div class="grid grid-cols-2 gap-4">
              <label class="text-sm space-y-1">
                <span class="block opacity-70 min-h-[2.5rem] flex items-end pb-1">Minutos antes de iniciar</span>
                <input
                  id="notifyBeforeStart"
                  type="number"
                  min="0"
                  class="w-full px-3 py-2 rounded-md bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700"
                />
              </label>
              <label class="text-sm space-y-1">
                <span class="block opacity-70 min-h-[2.5rem] flex items-end pb-1">Minutos antes de finalizar</span>
                <input
                  id="notifyBeforeEnd"
                  type="number"
                  min="0"
                  class="w-full px-3 py-2 rounded-md bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700"
                />
              </label>
            </div>
            <!-- Botón de guardar movido al final -->
          </div>
          <div class="space-y-2">
            <div class="font-medium">Apariencia</div>
            <div class="flex items-center justify-between">
              <span class="text-sm opacity-70">Modo Oscuro</span>
              <button
                type="button"
                id="themeToggle"
                class="px-3 py-2 rounded-md border border-slate-200 dark:border-slate-700 text-sm hover:bg-slate-100 dark:hover:bg-slate-700"
              >
                Alternar Tema
              </button>
            </div>
          </div>
          <div class="space-y-2">
            <div class="font-medium">Permisos</div>
            <div class="grid grid-cols-2 gap-2">
              <button
                type="button"
                id="askNotifyPerm"
                class="px-3 py-2 rounded-md border border-slate-200 dark:border-slate-700"
              >
                Permiso de notificaciones
              </button>
              <button
                type="button"
                id="askGeoPerm"
                class="px-3 py-2 rounded-md border border-slate-200 dark:border-slate-700"
              >
                Permiso de ubicación
              </button>
            </div>
            <div class="text-xs opacity-70">
              Los permisos requieren HTTPS o localhost.
            </div>
          </div>
        </div>
        <button
          type="button"
          id="saveSettings"
          class="w-full mt-4 px-3 py-2 rounded-md bg-slate-900 text-white dark:bg-white dark:text-slate-900 font-medium"
        >
          Guardar cambios
        </button>
      </div>
    </div>

    <script type="module" src="./js/widgets.js"></script>
</body>

</html>
